<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Phrasal Verb Alias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Learning version of the Neuro-Fluent Alias game: only the 20 phrasal verbs from the kiss-cam and Left Behind lessons.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: the Neuro-Fluent Alias pastel system (one centred 760px column, soft pill controls); kiss-cam verbs on pink, mountain verbs on sky */
:root{
  --bg:#fdf8f3; --card:#ffffff; --soft:#f8f4fb; --glass:rgba(255,255,255,.72);
  --ink:#2d2a3e; --ink2:#6b6780; --muted:#8f8aa3; --line:#eee7f3; --line2:#e0d7ea;
  --on-ink:#ffffff; --ink-hover:#433f5a; --knob:#ffffff; --topbg:rgba(253,248,243,.86);
  --mint:#d3f2e6;  --mint-ink:#2f7d63;  --mint-line:#a8e0c9;
  --peach:#ffe1d3; --peach-ink:#b5532e; --peach-line:#ffc4a8;
  --lav:#e8e2ff;   --lav-ink:#5b4bb7;   --lav-line:#cbbfff;
  --butter:#fff3c4;--butter-ink:#8a6a00;--butter-line:#f5dd85;
  --sky:#dcedff;   --sky-ink:#2c6aa6;   --sky-line:#b3d4f7;
  --pink:#ffe0ec;  --pink-ink:#b03a6a;  --pink-line:#ffbcd4;
  --shadow:0 10px 30px rgba(91,75,183,.08),0 2px 6px rgba(91,75,183,.05);
  --scrim:rgba(45,42,62,.28);
  --display:'Unbounded',system-ui,-apple-system,'Segoe UI',sans-serif; --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-sm:10px; --r-md:14px; --r-lg:22px; --pill:999px; --tb:58px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18161f; --card:#221f2c; --soft:#2a2636; --glass:rgba(10,8,18,.32);
  --ink:#f1eef8; --ink2:#bdb7d0; --muted:#8e88a4; --line:#332f42; --line2:#443e57;
  --on-ink:#18161f; --ink-hover:#d9d3ea; --knob:#f1eef8; --topbg:rgba(24,22,31,.86);
  --mint:#1c3a31;  --mint-ink:#8fe0bf;  --mint-line:#2f6151;
  --peach:#40271d; --peach-ink:#ffb08f; --peach-line:#6e402d;
  --lav:#2b2550;   --lav-ink:#c4b8ff;   --lav-line:#4a4082;
  --butter:#3a3116;--butter-ink:#f2d36b;--butter-line:#62532a;
  --sky:#1c2d45;   --sky-ink:#9ccaf7;   --sky-line:#304d74;
  --pink:#42202d;  --pink-ink:#ffa2c6;  --pink-line:#6d3349;
  --shadow:0 10px 30px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18161f; --card:#221f2c; --soft:#2a2636; --glass:rgba(10,8,18,.32);
  --ink:#f1eef8; --ink2:#bdb7d0; --muted:#8e88a4; --line:#332f42; --line2:#443e57;
  --on-ink:#18161f; --ink-hover:#d9d3ea; --knob:#f1eef8; --topbg:rgba(24,22,31,.86);
  --mint:#1c3a31;  --mint-ink:#8fe0bf;  --mint-line:#2f6151;
  --peach:#40271d; --peach-ink:#ffb08f; --peach-line:#6e402d;
  --lav:#2b2550;   --lav-ink:#c4b8ff;   --lav-line:#4a4082;
  --butter:#3a3116;--butter-ink:#f2d36b;--butter-line:#62532a;
  --sky:#1c2d45;   --sky-ink:#9ccaf7;   --sky-line:#304d74;
  --pink:#42202d;  --pink-ink:#ffa2c6;  --pink-line:#6d3349;
  --shadow:0 10px 30px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;min-height:100vh;
  background-image:radial-gradient(circle at 8% 0%,var(--lav) 0,transparent 32%),radial-gradient(circle at 100% 30%,var(--mint) 0,transparent 30%),radial-gradient(circle at 20% 100%,var(--peach) 0,transparent 30%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lav-ink);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--topbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.02em;cursor:pointer;background:none;border:none;padding:0;white-space:nowrap}
.brand span{color:var(--lav-ink)}
.nav button{padding:7px 13px;font-size:13px}
.nav button:disabled{opacity:.45;cursor:not-allowed}

/* scoreboard */
.scorebar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tb));z-index:40;background:var(--topbg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scorebar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sc{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:var(--pill);padding:4px 5px 4px 11px}
.sc.active{border-color:var(--lav-ink);box-shadow:0 0 0 2px var(--lav)}
.sc .nm{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid var(--line2)}
.sc .val{font-family:var(--display);font-weight:800;font-size:15px;min-width:18px;text-align:center;color:var(--lav-ink);font-variant-numeric:tabular-nums}
.sc .pm{display:flex;gap:3px}
.sc .pm button{width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink2);cursor:pointer;font-weight:700;font-size:14px;line-height:1}
.sc .pm button:hover{border-color:var(--lav-ink);color:var(--lav-ink)}
.rst{margin-left:auto;font-size:12px;color:var(--ink2);background:transparent;border:1px solid var(--line2);border-radius:var(--pill);padding:6px 12px;cursor:pointer}
.rst:hover{color:var(--ink);background:var(--card)}

/* hero */
.hero{padding:36px 0 22px;text-align:center}
.kicker{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--lav-ink);background:var(--lav);border:1px solid var(--lav-line);padding:6px 14px;border-radius:var(--pill);margin-bottom:16px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,10vw,68px);line-height:1;letter-spacing:-.04em}
.hero h1 .a{color:var(--peach-ink)}.hero h1 .b{color:var(--lav-ink)}.hero h1 .c{color:var(--mint-ink)}.hero h1 .d{color:var(--pink-ink)}.hero h1 .e{color:var(--sky-ink)}
.hero h1 small{display:block;font-size:.34em;letter-spacing:-.01em;color:var(--ink);margin-top:10px}
.hero p{color:var(--ink2);font-size:16px;max-width:500px;margin:14px auto 0;text-wrap:balance}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.step{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--lav-ink)}
.h2{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.2;margin-top:4px;text-wrap:balance}
.lead{color:var(--ink2);font-size:15px;margin-top:6px;max-width:60ch}
.lbl{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row{margin-bottom:22px}.row:last-of-type{margin-bottom:20px}
.grp{margin-top:16px}

.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:var(--pill);padding:4px;gap:3px}
.seg button{font-weight:600;font-size:14px;cursor:pointer;border:none;background:transparent;color:var(--ink2);padding:8px 16px;border-radius:var(--pill);transition:.15s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.pfield{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;min-width:0}
.pfield input{flex:1;min-width:0;background:transparent;border:none;color:var(--ink);font-family:var(--body);font-size:16px;font-weight:600;outline:none}
.pfield .x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.pfield .x:hover{color:var(--pink-ink)}
.addp{border:1px dashed var(--line2);background:transparent;border-radius:var(--r-md);padding:8px 10px;color:var(--ink2);font-weight:600;font-size:14px;cursor:pointer}
.addp:hover{border-color:var(--lav-ink);color:var(--lav-ink)}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-weight:600;font-size:14px;cursor:pointer;background:var(--card);color:var(--ink2);border:1px solid var(--line2);padding:7px 13px;border-radius:var(--pill);transition:.12s;user-select:none}
.chip:hover{border-color:var(--muted)}
.chip .n{font-size:11px;opacity:.65;margin-left:4px}
.chip.on{background:var(--lav);border-color:var(--lav-line);color:var(--lav-ink)}
.chip.time.on{background:var(--butter);border-color:var(--butter-line);color:var(--butter-ink)}
.selcount{font-size:13px;color:var(--ink2);margin-top:10px}

.btn{font-family:var(--display);font-weight:700;font-size:15px;cursor:pointer;border-radius:var(--pill);padding:14px 26px;transition:.15s;border:1px solid transparent;letter-spacing:-.01em}
.btn-main{background:var(--ink);color:var(--on-ink)}
.btn-main:hover{background:var(--ink-hover)}
.btn-soft{background:var(--lav);color:var(--lav-ink);border-color:var(--lav-line)}
.btn-soft:hover{border-color:var(--lav-ink)}
.btn-block{display:block;width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn-row.c{justify-content:center}
.note{background:var(--butter);border:1px solid var(--butter-line);padding:12px 16px;border-radius:var(--r-md);font-size:14px;color:var(--ink);margin-top:16px}
.note b{color:var(--butter-ink)}
.note p+p{margin-top:6px}
.mini-link{background:none;border:none;color:var(--lav-ink);font-weight:600;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-top:12px;display:block}

/* verb chips (progress) */
.vstrip{display:flex;flex-wrap:wrap;gap:6px}
.vchip{font-weight:600;font-size:13.5px;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line2);padding:6px 11px;border-radius:var(--pill);display:inline-flex;align-items:center;gap:5px}
.vchip:hover{border-color:var(--lav-ink)}
.vchip.k{background:var(--mint);border-color:var(--mint-line);color:var(--mint-ink)}
.vchip.k::before{content:"✓";font-weight:800}
.vchip.n{background:var(--peach);border-color:var(--peach-line);color:var(--peach-ink)}
.vchip.n::before{content:"↺";font-weight:800}
.vchip.cur{box-shadow:0 0 0 2px var(--lav-ink)}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .track{flex:1}
.pbar{height:100%;background:linear-gradient(90deg,var(--mint-line),var(--mint-ink));border-radius:var(--pill);transition:width .4s}
.prog .pt{font-weight:700;font-size:13px;color:var(--mint-ink);white-space:nowrap;font-variant-numeric:tabular-nums}

/* toggles */
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink2);user-select:none}
.toggle .sw{width:42px;height:24px;border-radius:var(--pill);background:var(--line2);position:relative;transition:.15s;flex-shrink:0}
.toggle .sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.15s}
.toggle.on .sw{background:var(--mint-ink)}
.toggle.on .sw::after{left:21px}
.toggle small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.tglist{display:flex;flex-direction:column;gap:12px}

/* role banner */
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--mint);border:1px solid var(--mint-line);border-radius:var(--r-md);padding:12px 16px;margin-bottom:16px}
.banner .now{font-family:var(--display);font-weight:800;font-size:16px;color:var(--mint-ink)}
.banner .sub{font-size:13px;color:var(--ink2)}
.banner .rnd{margin-left:auto;font-weight:700;font-size:12px;color:var(--mint-ink);letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.intro{text-align:center;padding:24px 10px}
.intro .who{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,40px);letter-spacing:-.02em;line-height:1.15}
.intro .who .nm{color:var(--lav-ink)}
.intro .role{color:var(--ink2);font-size:15px;margin-top:8px}
.intro .others{margin-top:6px;color:var(--muted);font-size:14px}

/* timer + no-timer dots */
.timer{margin-bottom:16px}
.track{height:12px;background:var(--soft);border-radius:var(--pill);overflow:hidden;border:1px solid var(--line)}
.bar{height:100%;width:100%;background:linear-gradient(90deg,var(--lav-line),var(--sky-line));border-radius:var(--pill);transition:width 1s linear}
.bar.low{background:linear-gradient(90deg,var(--pink-line),var(--peach-line))}
.clock{font-family:var(--display);font-weight:800;font-size:32px;text-align:center;margin-top:8px;font-variant-numeric:tabular-nums}
.clock.low{color:var(--pink-ink)}
.pz{font-family:var(--body);font-size:13px;font-weight:700;color:var(--butter-ink);background:var(--butter);border:1px solid var(--butter-line);border-radius:var(--pill);padding:3px 10px;vertical-align:middle;margin-left:8px}
.dots{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:16px;font-weight:700;font-size:13px;color:var(--ink2)}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--soft);border:1px solid var(--line2)}
.dots i.g{background:var(--mint-ink);border-color:var(--mint-ink)}
.dots i.s{background:var(--peach-line);border-color:var(--peach-ink)}

/* play card */
.play{border-radius:var(--r-lg);padding:34px 22px 24px;text-align:center;min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;border:1px solid var(--lav-line);background:var(--lav);transition:background .25s,border-color .25s}
.play .cat{font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.play .word{font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,56px);line-height:1.05;letter-spacing:-.02em;color:var(--ink);word-break:break-word;text-wrap:balance}
.ru{margin-top:16px;font-size:16px;font-weight:600;color:var(--ink2);background:var(--glass);border-radius:var(--pill);padding:7px 16px;transition:opacity .2s;max-width:100%}
.ru.off{opacity:0;pointer-events:none}
.left{display:block;margin-top:12px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);opacity:.75}
.play.hidden .word,.play.hidden .ru{filter:blur(14px);user-select:none}
.play.hidden ~ .clues,.play.hidden ~ .taboo{filter:blur(10px);user-select:none}
.taboo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-top:12px}
.taboo b{font-family:var(--display);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--pink-ink);margin-right:2px}
.taboo span{font-size:13px;font-weight:700;padding:3px 10px;border-radius:var(--pill);border:1px dashed var(--pink-line);color:var(--pink-ink);background:var(--pink);text-decoration:line-through}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.tbtn{font-weight:600;font-size:13px;color:var(--ink2);background:var(--card);border:1px solid var(--line2);border-radius:var(--pill);padding:7px 14px;cursor:pointer}
.tbtn:hover{border-color:var(--lav-ink);color:var(--lav-ink)}
.tbtn.vcard{background:var(--butter);border-color:var(--butter-line);color:var(--butter-ink);font-weight:700}
.tbtn.vcard:hover{border-color:var(--butter-ink)}

.clues{margin-top:12px;background:var(--card);border:1px dashed var(--butter-line);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.clues .ch b{font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--butter-ink)}
.cl{display:flex;align-items:center;gap:10px}
.cl .t{flex:1;min-width:0;font-size:17px;font-weight:600;line-height:1.35}
.cl .n{font-family:var(--display);font-weight:800;font-size:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--butter);color:var(--butter-ink);flex-shrink:0}
.gap{display:inline-block;min-width:2.2em;border-bottom:2.5px solid var(--butter-ink);color:transparent;line-height:1;margin:0 1px}
.spk{border:1px solid var(--line2);background:var(--soft);border-radius:var(--pill);width:32px;height:32px;display:inline-grid;place-items:center;cursor:pointer;flex-shrink:0;font-size:14px;vertical-align:middle}
.spk:hover{border-color:var(--lav-ink)}

.actions{display:flex;gap:12px;margin-top:16px}
.act{flex:1;font-family:var(--display);font-weight:700;font-size:18px;cursor:pointer;border-radius:var(--r-md);padding:18px;transition:.12s;border:1px solid}
.act:active{transform:scale(.98)}
.act-yes{background:var(--mint);color:var(--mint-ink);border-color:var(--mint-line)}
.act-yes:hover{border-color:var(--mint-ink)}
.act-skip{background:var(--peach);color:var(--peach-ink);border-color:var(--peach-line)}
.act-skip:hover{border-color:var(--peach-ink)}
.counters{display:flex;justify-content:center;gap:22px;margin-top:14px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.counters .g{color:var(--mint-ink)}.counters .s{color:var(--peach-ink)}.counters .st{color:var(--butter-ink)}
.keys{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}

/* learning stop */
.reveal{border-radius:var(--r-lg);padding:26px 20px 22px;text-align:center;border:1px solid var(--mint-line);background:var(--mint)}
.rv-ok{display:inline-block;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mint-ink);background:var(--glass);border-radius:var(--pill);padding:4px 12px}
.rv-word{font-family:var(--display);font-weight:800;font-size:clamp(30px,7.5vw,46px);line-height:1.1;letter-spacing:-.02em;margin-top:10px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.rv-ru{font-weight:700;font-size:17px;margin-top:6px}
.rv-def{color:var(--ink2);font-size:15px;margin-top:2px}
.rv-story{background:var(--glass);border-radius:var(--r-md);padding:10px 14px;font-size:15.5px;text-align:left;margin-top:14px}
.rv-story .lab{display:block;font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}

.task-h b{color:var(--butter-ink)}
.task .ruu{margin-top:2px}
.idea{margin-top:10px}
.idea summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--butter-ink);list-style:none}
.idea summary::-webkit-details-marker{display:none}
.idea summary::before{content:"💡 "}
.idea .il{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.idea .il div{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--glass);border-radius:var(--r-sm);padding:8px 10px;font-weight:600}
.stars{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.star{font-weight:700;font-size:14px;cursor:pointer;border-radius:var(--pill);border:1px solid var(--butter-line);background:var(--card);color:var(--ink);padding:9px 14px}
.star:hover{border-color:var(--butter-ink)}
.star.on{background:var(--butter-ink);border-color:var(--butter-ink);color:var(--on-ink)}

/* results */
.big{font-family:var(--display);font-weight:800;font-size:64px;color:var(--lav-ink);line-height:1;text-align:center}
.bigsub{color:var(--ink2);text-align:center;margin:6px 0 10px}
.wl-h{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.wl{display:flex;gap:6px;flex-wrap:wrap}
.wl span,.wl button{font-family:inherit;font-size:14px;font-weight:600;padding:5px 12px;border-radius:var(--pill);border:1px solid}

.wl.st span{background:var(--butter);border-color:var(--butter-line);color:var(--butter-ink)}

.wl .none{border:none;background:none;color:var(--muted)}
.wl-tip{font-size:12.5px;color:var(--muted);margin-top:10px}
.winner{font-family:var(--display);font-weight:800;font-size:24px;text-align:center;color:var(--lav-ink)}
.stand{display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px;margin-top:8px}
.stand .m{font-size:22px}.stand .sn{font-weight:700;font-size:16px;flex:1;min-width:0}.stand .ss{font-family:var(--display);font-weight:800;font-size:20px;color:var(--lav-ink);font-variant-numeric:tabular-nums}

/* learn: flashcard */
.lhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}

#lstrip{margin-top:14px}
.fc-front{border-radius:var(--r-lg);padding:22px 20px 26px;text-align:center;border:1px solid}
.fc-meta{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}

.fc-verb{font-family:var(--display);font-weight:800;font-size:clamp(40px,10vw,64px);line-height:1.05;letter-spacing:-.03em;margin-top:18px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;text-wrap:balance}

.fcard .btn-block{margin-top:14px}
.fc-acts{display:flex;gap:10px;margin-top:16px;align-items:stretch}

.vsec:last-child{padding-bottom:0}

footer{text-align:center;margin-top:36px;color:var(--muted);font-size:13px}

#app>.card:first-child{margin-top:20px}
@media(max-width:520px){.card{padding:18px}.play{padding:28px 14px 20px}.act{font-size:16px;padding:16px 10px}.hero{padding:26px 0 18px}.nbtn{width:46px}}

try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/_{3}(\s_{3})*/g,'blank'));u.lang='en-US';if(voice)u.voice=voice;u.rate=.92;speechSynthesis.speak(u);}catch(e){}}

  $('lprog').innerHTML=`<div class="track"><div class="pbar" style="width:${Math.round(k/PV.length*100)}%"></div></div><span class="pt">✓ ${k} of ${PV.length} known</span>`;
  $('lstrip').innerHTML=list.map((p,i)=>`<button type="button" class="vchip ${vcls(p)}${i===li?' cur':''}" data-i="${i}" aria-current="${i===li}">${esc(p.v)}</button>`).join('');
  $('lstrip').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{li=+b.dataset.i;lOpen=false;renderLearn();});
  const p=list[li],c=SRC[p.src].col;
  $('fc').innerHTML=`<section class="card fcard" aria-label="Verb ${li+1} of ${list.length}">
    <div class="fc-front" style="background:var(--${c});border-color:var(--${c}-line)">
      <div class="fc-meta"><span style="color:var(--${c}-ink)">${SRC[p.src].label}</span><span class="ix">${li+1} / ${list.length}</span></div>
      <div class="fc-verb">${esc(p.v)} ${spk(p.v)}</div>
      <p class="fc-ctx">${p.ctx}</p>
      ${lOpen?'':'<p class="fc-q">What does it mean? Guess first, then open the card.</p>'}
    </div>
    ${lOpen?`<div class="vb">${bodyHTML(p)}</div>`:'<button class="btn btn-soft btn-block" type="button" id="fcOpen">Show the meaning ▾</button>'}
    <div class="fc-acts"><button class="nbtn" type="button" id="fcPrev" aria-label="Previous verb">←</button>
      <button class="act act-skip" type="button" id="fcNo">↺ Not yet</button><button class="act act-yes" type="button" id="fcYes">✓ I know it</button>
      <button class="nbtn" type="button" id="fcNext" aria-label="Next verb">→</button></div>
    <div class="keys">Keyboard: Space = open the card · ← → = previous / next</div></section>`;
  const step=d=>{li=(li+d+list.length)%list.length;lOpen=false;renderLearn();};
  if($('fcOpen'))$('fcOpen').onclick=()=>{lOpen=true;renderLearn();};
  $('fcPrev').onclick=()=>step(-1);$('fcNext').onclick=()=>step(1);
  $('fcNo').onclick=()=>{S.known[p.v]=-1;save();step(1);};
  $('fcYes').onclick=()=>{S.known[p.v]=1;save();step(1);};
}

/* ----- verb card body (learn + drawer) ----- */
function cluesHTML(p,head){
  return `<div class="ch"><b>${head||'💡 Easy clues · read them out'}</b></div>`+p.clues.map((t,i)=>`<div class="cl"><span class="n">${i+1}</span><span class="t">${gapify(t)}</span>${spk(t)}</div>`).join('');
}
const tabooHTML=p=>`<b>🚫 Don't say</b>`+p.taboo.map(w=>`<span>${esc(w)}</span>`).join('');
function bodyHTML(p){
  const t=p.trap;
  return `<div class="vsec"><div class="vlbl">Meaning</div><div class="mean-en">${esc(p.def)}</div><div class="mean-ru">🇷🇺 ${esc(p.ru)}</div><div class="forms">${p.forms}</div></div>
  <div class="vsec"><div class="vlbl">Meanings + examples</div><ol class="ml">${p.means.map((m,i)=>`<li><div class="ml-lab">${esc(m[0])}${i===0?'<span class="tagx">in the story</span>':''}</div><div class="ml-ex"><span>${esc(m[1])}</span>${spk(m[1])}</div><div class="ruu">${esc(m[2])}</div></li>`).join('')}</ol></div>
  <div class="vsec trapx"><div class="vlbl">Trap for Russian speakers</div><p><span class="x">${esc(t[0])}</span></p><p><span class="y">${esc(t[1])}</span></p>${t[2]?`<p class="ruu">${esc(t[2])}</p>`:''}</div>
  <div class="vsec"><div class="vlbl">Say it with</div><div class="coll">${p.coll.map(c=>`<span><b>${esc(c[0])}</b><small>${esc(c[1])}</small></span>`).join('')}</div></div>
  <div class="vsec"><div class="vlbl">Explain it in Alias</div><div class="clues">${cluesHTML(p,'💡 Clues you can use')}</div><div class="taboo">${tabooHTML(p)}</div></div>`;
}

/* ----- game screens ----- */
function introHTML(){
  const g=guesserIdx();
  return `<div class="card"><div class="banner"><span class="now">🎙 ${esc(nm(dIdx))} describes</span><span class="sub">${esc(guessersStr())} ${g.length>1?'guess':'guesses'}</span><span class="rnd">round ${pass} · turn ${turn+1}</span></div>
    <div class="intro"><div class="who"><span class="nm">${esc(nm(dIdx))}</span>, you're up!</div>
    <div class="role">Describe each phrasal verb in English. Don't say its words!</div>
    <div class="others">${S.secs?`${S.secs} seconds`:`${TURN_WORDS} verbs, no timer`}${S.stop?' · learning stop after each guess':''}</div></div>
    <div class="btn-row c"><button class="btn btn-main" type="button" id="startTurn">Start ▶</button><button class="btn btn-soft" type="button" id="back">⚙ Settings</button></div></div>`;
}
function playHTML(){
  const top=S.secs?`<div class="timer"><div class="track"><div class="bar" id="bar"></div></div><div class="clock" id="clock">${fmt(S.secs)}</div></div>`
    :`<div class="dots" id="dots" aria-label="Verbs this turn"></div>`;
  return `<div class="card"><div class="banner"><span class="now">🎙 ${esc(nm(dIdx))}</span><span class="sub">describing</span><span class="rnd">round ${pass}</span></div>
    ${top}<div id="stage"></div>
    <div class="counters"><span class="g">✓ <b id="gc">0</b></span><span class="st">⭐ <b id="stc">0</b></span><span class="s">⏭ <b id="scnt">0</b></span></div>
    <div class="keys" id="keys"></div></div>`;
}
function wordHTML(p){
  const c=SRC[p.src].col;
  return `<div class="play${hidden?' hidden':''}" id="playCard" style="background:var(--${c});border-color:var(--${c}-line)">
      <div class="cat" style="color:var(--${c}-ink)">${SRC[p.src].label}</div>
      <div class="word">${esc(p.v)}</div>
      <div class="ru${S.hint?'':' off'}" id="ru">🇷🇺 ${esc(p.ru)}</div>
      <span class="left">${queue.length} left in the deck</span></div>
    <div class="taboo">${tabooHTML(p)}</div>
    <div class="clues" id="clues"${S.clues?'':' hidden'}>${cluesHTML(p)}</div>
    <div class="tools"><button class="tbtn vcard" type="button" id="cardBtn">📖 Verb card</button><button class="tbtn" type="button" id="peek">${hidden?'👁 Show word':'🙈 Hide word'}</button><button class="tbtn" type="button" id="hintBtn">${S.hint?'Hide Russian':'🇷🇺 Show Russian'}</button><button class="tbtn" type="button" id="cluesBtn">${S.clues?'Hide clues':'💡 Show clues'}</button><button class="tbtn" type="button" id="endEarly">⏹ End turn</button></div>
    <div class="actions"><button class="act act-skip" type="button" id="skip">⏭ Skip</button><button class="act act-yes" type="button" id="yes">✓ Got it</button></div>`;
}
function revealHTML(p){
  const ideas=p.means.slice(1).map(m=>`<div><span>${esc(m[1])}</span>${spk(m[1])}</div>`).join('');
  const g=guesserIdx();
  return `<div class="reveal" aria-live="polite"><span class="rv-ok">✓ Guessed!</span>
      <div class="rv-word">${esc(p.v)} ${spk(p.v)}</div>
      <div class="rv-ru">🇷🇺 ${esc(p.ru)}</div><div class="rv-def">${esc(p.def)}</div>
      <div class="rv-story"><span class="lab">In the story · ${esc(SRC[p.src].name)}</span>${p.ctx}</div></div>
    <div class="task"><div class="task-h">🗣 ${esc(guessersStr())}: say your own sentence with <b>${esc(p.v)}</b>.</div>
      <div class="ruu">Своё предложение: о себе, о работе, о друзьях.</div>
      <details class="idea"><summary>Need an idea?</summary><div class="il">${ideas}</div></details>
      <div class="stars">${g.map(i=>{const on=stars.some(s=>s.v===p.v&&s.i===i);return `<button type="button" class="star${on?' on':''}" data-st="${i}" aria-pressed="${on}">⭐ Good sentence · +1 ${esc(nm(i))}</button>`;}).join('')}</div></div>
    <div class="actions"><button class="act act-yes" type="button" id="nextW">Next verb ▶</button></div>`;
}
function endHTML(){
  const next=(dIdx+1)%N();
  const none='<span class="none">—</span>';
  const gl=got.length?got.map((w,i)=>`<button type="button" data-g="${i}">${esc(w.v)}<small>${esc(shortRu(w))}</small></button>`).join(''):none;
  const sl=skipped.length?skipped.map((w,i)=>`<button type="button" data-s="${i}">${esc(w.v)}<small>${esc(shortRu(w))}</small></button>`).join(''):none;
  const st=S.players.map((p,i)=>{const n=stars.filter(s=>s.i===i).length;return n?`<span>⭐ ${esc(nm(i))} +${n}</span>`:'';}).join('');
  return `<div class="card"><div class="big">${got.length}</div><div class="bigsub">verbs guessed · +${got.length} for ${esc(nm(dIdx))}</div>
    <div class="wl-h">✓ Guessed</div><div class="wl g" id="gList">${gl}</div>
    <div class="wl-h">⏭ Skipped</div><div class="wl s" id="sList">${sl}</div>
    ${st?`<div class="wl-h">⭐ Good sentences</div><div class="wl st">${st}</div>`:''}
    <div class="wl-tip">Tap any verb to open its card. Skipped verbs come back later in the game.</div>
    <div class="btn-row"><button class="btn btn-main" type="button" id="next">${next===0?'Next round':'Next'}: ${esc(nm(next))} ▶</button><button class="btn btn-soft" type="button" id="stand">🏁 Standings</button></div></div>`;
}
function standHTML(){
  const o=S.players.map((p,i)=>({p:nm(i),s:S.scores[i]})).sort((a,b)=>b.s-a.s);
  const med=['🥇','🥈','🥉','🎈','🎈','🎈'];
  const tie=o.length>1&&o[0].s===o[1].s;
  return `<div class="card"><div class="winner">${tie?'🤝 It\'s a tie!':`🏆 ${esc(o[0].p)} leads!`}</div>
    ${o.map((x,r)=>`<div class="stand"><span class="m">${med[r]}</span><span class="sn">${esc(x.p)}</span><span class="ss">${x.s}</span></div>`).join('')}
    <div class="btn-row"><button class="btn btn-main" type="button" id="keep">Keep playing ▶</button><button class="btn btn-soft" type="button" id="again">New game (scores to 0)</button><button class="btn btn-soft" type="button" id="back">⚙ Settings</button></div></div>`;
}

/* ===== TIMER ===== */
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function pauseLabel(){return pauses.has('stop')?'⏸ Learning stop':pauses.has('card')?'⏸ Verb card':'';}
function tick(){
  const b=$('bar'),c=$('clock');if(!b)return;
  b.style.width=(left/S.secs*100)+'%';
  const pl=pauseLabel();c.innerHTML=fmt(left)+(pl?`<span class="pz">${pl}</span>`:'');
  const low=left<=10;b.classList.toggle('low',low);c.classList.toggle('low',low);
}
function startTimer(){left=S.secs;tick();timer=setInterval(()=>{if(pauses.size)return;left--;if(left<0)left=0;tick();if(left<=0)finishTurn();},1000);}
function setPause(r,on){if(on)pauses.add(r);else pauses.delete(r);tick();}
function finishTurn(){stopTimer();closeDrawer();addScore(dIdx,got.length);go('end');}

/* ===== TURN FLOW ===== */
function updCounters(){
  if(!$('gc'))return;
  $('gc').textContent=got.length;$('scnt').textContent=skipped.length;$('stc').textContent=stars.length;
  const d=$('dots');if(d){
    d.innerHTML=Array.from({length:TURN_WORDS},(_,i)=>`<i class="${hist[i]||''}"></i>`).join('')+`<span>${Math.min(hist.length,TURN_WORDS)} / ${TURN_WORDS}</span>`;}
}
let hist=[];
function setKeys(){const k=$('keys');if(k)k.textContent=revealing?'Keyboard: Enter or → = next verb':'Keyboard: → or Enter = got it · ← = skip · C = verb card';}
function showWord(){
  revealing=false;setPause('stop',false);
  if(!queue.length)refill();
  current=queue.shift();
  $('stage').innerHTML=wordHTML(current);
  $('yes').onclick=()=>mark(true);$('skip').onclick=()=>mark(false);
  $('endEarly').onclick=finishTurn;$('cardBtn').onclick=()=>openDrawer(current);
  $('peek').onclick=()=>{hidden=!hidden;$('playCard').classList.toggle('hidden',hidden);$('peek').textContent=hidden?'👁 Show word':'🙈 Hide word';};
  $('hintBtn').onclick=()=>{S.hint=!S.hint;save();$('ru').classList.toggle('off',!S.hint);$('hintBtn').textContent=S.hint?'Hide Russian':'🇷🇺 Show Russian';};
  $('cluesBtn').onclick=()=>{S.clues=!S.clues;save();$('clues').hidden=!S.clues;$('cluesBtn').textContent=S.clues?'Hide clues':'💡 Show clues';};
  setKeys();
}
function mark(ok){
  if(view!=='play'||revealing||!current||$('drawer').classList.contains('open'))return;
  if(S.secs&&!timer)return;
  if(ok)got.push(current);else skipped.push(current);
  hist.push(ok?'g':'s');updCounters();
  if(ok&&S.stop){showReveal(current);return;}
  advance();
}
function advance(){if(!S.secs&&hist.length>=TURN_WORDS){finishTurn();return;}showWord();}
function showReveal(p){
  revealing=true;setPause('stop',true);
  $('stage').innerHTML=revealHTML(p);
  $('stage').querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const i=+b.dataset.st,k=stars.findIndex(s=>s.v===p.v&&s.i===i);
    if(k>=0){stars.splice(k,1);addScore(i,-1);b.classList.remove('on');b.setAttribute('aria-pressed','false');}
    else{stars.push({v:p.v,i});addScore(i,1);b.classList.add('on');b.setAttribute('aria-pressed','true');}
    updCounters();});
  $('nextW').onclick=nextAfterReveal;setKeys();
}
function nextAfterReveal(){if(!revealing)return;revealing=false;setPause('stop',false);advance();}

/* ===== WIRING ===== */
function wireTog(id,key){const el=$(id);const f=()=>{S[key]=!S[key];save();el.classList.toggle('on',S[key]);el.setAttribute('aria-checked',S[key]);};el.onclick=f;el.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();f();}};}
const wire={
  home(){
    $('toLearn').onclick=()=>{lOpen=false;go('learn');};
    app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{lf='all';li=PV.findIndex(p=>p.v===b.dataset.go);lOpen=false;go('learn');});
    const goLbl=()=>{$('go').textContent=`Start: ${nm(0)} describes first ▶`;};
    $('pgrid').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{S.players[+inp.dataset.i]=inp.value;save();goLbl();});
    $('pgrid').querySelectorAll('.x').forEach(x=>x.onclick=()=>{const i=+x.dataset.x;S.players.splice(i,1);S.scores.splice(i,1);save();render(true);});
    const ap=$('addp');if(ap)ap.onclick=()=>{S.players.push('Player '+(N()+1));S.scores.push(0);save();render(true);const f=$('pl'+(N()-1));if(f){f.focus();f.select();}};
    $('srcChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const k=c.dataset.c;let nx=S.srcs.includes(k)?S.srcs.filter(x=>x!==k):S.srcs.concat(k);if(!nx.length)nx=[k===SRCS[0]?SRCS[1]:SRCS[0]];S.srcs=nx;save();
      $('srcChips').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',S.srcs.includes(x.dataset.c)));$('selCount').textContent=pool().length+' verbs in the deck';});
    $('timeChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.secs=+c.dataset.s;save();$('timeChips').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));});
    wireTog('stopTog','stop');wireTog('hintTog','hint');wireTog('cluesTog','clues');
    $('go').onclick=()=>{S.players=S.players.map((p,i)=>p.trim()||('Player '+(i+1)));S.scores=S.players.map(()=>0);save();
      dIdx=0;pass=1;turn=0;got=[];skipped=[];stars=[];refill();gameOn=true;go('intro');};
    const r=$('resume');if(r)r.onclick=()=>go(lastPhase);
  },
  learn(){
    $('lfSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{lf=b.dataset.f;li=0;lOpen=false;$('lfSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderLearn();});
    $('toPlay').onclick=()=>go(gameOn?lastPhase:'home');
    renderLearn();
  },
  intro(){
    $('startTurn').onclick=()=>{got=[];skipped=[];stars=[];hist=[];hidden=false;go('play');};
    $('back').onclick=()=>go('home');
  },
  play(){showWord();updCounters();if(S.secs)startTimer();},
  end(){
    $('next').onclick=()=>{dIdx=(dIdx+1)%N();if(dIdx===0)pass++;turn++;go('intro');};
    $('stand').onclick=()=>go('stand');
    $('gList').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>openDrawer(got[+b.dataset.g]));
    $('sList').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>openDrawer(skipped[+b.dataset.s]));
  },
  stand(){
    $('keep').onclick=()=>{dIdx=(dIdx+1)%N();if(dIdx===0)pass++;turn++;go('intro');};
    $('again').onclick=()=>{S.scores=S.players.map(()=>0);save();dIdx=0;pass=1;turn=0;refill();go('intro');};
    $('back').onclick=()=>go('home');
  }
};

/* ===== VERB CARD DRAWER ===== */
const drawer=$('drawer'),scrim=$('scrim');let lastFocus=null;
function openDrawer(p){
  if(!p)return;const c=SRC[p.src].col;
  $('dBody').innerHTML=`<div class="dcard"><div class="dsrc" style="color:var(--${c}-ink)">${SRC[p.src].label} · ${esc(SRC[p.src].name)}</div>
    <div class="dverb">${esc(p.v)} ${spk(p.v)}</div><div class="dctx">${p.ctx}</div><div class="vb">${bodyHTML(p)}</div></div>`;
  $('dBody').scrollTop=0;lastFocus=document.activeElement;
  drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');scrim.classList.add('open');
  if(view==='play')setPause('card',true);
  $('dClose').focus();
}
function closeDrawer(){
  if(!drawer.classList.contains('open'))return;
  drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');scrim.classList.remove('open');
  if(view==='play')setPause('card',false);
  if(lastFocus&&document.contains(lastFocus))try{lastFocus.focus();}catch(e){}
}
$('dClose').onclick=closeDrawer;scrim.onclick=closeDrawer;

/* ===== KEYS + SPEECH ===== */
document.addEventListener('keydown',e=>{
  if(drawer.classList.contains('open')){if(e.key==='Escape')closeDrawer();return;}
  const t=e.target;if(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)return;
  if((e.key==='Enter'||e.key===' ')&&t.closest&&t.closest('button,summary,[role="switch"]'))return;
  if(view==='play'){
    if(revealing){if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();nextAfterReveal();}return;}
    if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();mark(true);}
    else if(e.key==='ArrowLeft'){e.preventDefault();mark(false);}
    else if(e.key==='c'||e.key==='C'){e.preventDefault();openDrawer(current);}
  }else if(view==='learn'){
    if(e.key==='ArrowRight'){e.preventDefault();$('fcNext').click();}
    else if(e.key==='ArrowLeft'){e.preventDefault();$('fcPrev').click();}
    else if(e.key===' '){e.preventDefault();lOpen=!lOpen;renderLearn();}
  }
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.preventDefault();speak(b.dataset.say);}});

render();
</script>
</body>
</html>

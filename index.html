<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alias · Neuro-Fluent</title>
<meta name="description" content="Alias speaking game — 1000+ everyday English words with Russian hints and a built-in Lifeline helper.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf8f3; --card:#ffffff; --soft:#f8f4fb;
  --ink:#2d2a3e; --ink2:#6b6780; --muted:#a09cb0; --line:#eee7f3; --line2:#e0d7ea;
  --mint:#d3f2e6;  --mint-ink:#2f7d63;  --mint-line:#a8e0c9;
  --peach:#ffe1d3; --peach-ink:#b5532e; --peach-line:#ffc4a8;
  --lav:#e8e2ff;   --lav-ink:#5b4bb7;   --lav-line:#cbbfff;
  --butter:#fff3c4;--butter-ink:#8a6a00;--butter-line:#f5dd85;
  --sky:#dcedff;   --sky-ink:#2c6aa6;   --sky-line:#b3d4f7;
  --pink:#ffe0ec;  --pink-ink:#b03a6a;  --pink-line:#ffbcd4;
  --display:'Unbounded',system-ui,sans-serif; --body:'Onest',system-ui,sans-serif;
  --r-sm:10px; --r-md:14px; --r-lg:22px; --pill:999px;
  --shadow:0 10px 30px rgba(91,75,183,.08),0 2px 6px rgba(91,75,183,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;min-height:100vh;
  background-image:radial-gradient(circle at 8% 0%,var(--lav) 0,transparent 32%),radial-gradient(circle at 100% 30%,var(--mint) 0,transparent 30%),radial-gradient(circle at 20% 100%,var(--peach) 0,transparent 30%);
  background-attachment:fixed}
button{font-family:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 110px}

/* top bar */
.topbar{position:sticky;top:0;z-index:50;background:rgba(253,248,243,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px}
.topbar .in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.02em;cursor:pointer}
.brand span{color:var(--lav-ink)}
.toptag{font-size:13px;font-weight:600;color:var(--ink2);background:var(--card);border:1px solid var(--line);padding:5px 12px;border-radius:var(--pill)}

/* scoreboard */
.scorebar{position:sticky;top:53px;z-index:40;background:rgba(253,248,243,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:8px 16px;display:none}
.scorebar.show{display:block}
.scorebar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sc{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:var(--pill);padding:4px 5px 4px 11px}
.sc.active{border-color:var(--lav-ink);box-shadow:0 0 0 2px var(--lav)}
.sc .nm{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.06)}
.sc .val{font-family:var(--display);font-weight:800;font-size:15px;min-width:18px;text-align:center;color:var(--lav-ink)}
.sc .pm{display:flex;gap:3px}
.sc .pm button{width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink2);cursor:pointer;font-weight:700;font-size:14px;line-height:1}
.sc .pm button:hover{border-color:var(--lav-ink);color:var(--lav-ink)}
.rst{margin-left:auto;font-size:12px;color:var(--ink2);background:transparent;border:1px solid var(--line2);border-radius:var(--pill);padding:6px 12px;cursor:pointer}
.rst:hover{color:var(--ink);background:var(--card)}

/* hero */
.hero{padding:40px 0 24px;text-align:center}
.kicker{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--lav-ink);background:var(--lav);border:1px solid var(--lav-line);padding:6px 14px;border-radius:var(--pill);margin-bottom:18px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,10vw,68px);line-height:1;letter-spacing:-.04em}
.hero h1 .a{color:var(--peach-ink)}.hero h1 .b{color:var(--lav-ink)}.hero h1 .c{color:var(--mint-ink)}.hero h1 .d{color:var(--pink-ink)}.hero h1 .e{color:var(--sky-ink)}
.hero p{color:var(--ink2);font-size:16px;max-width:500px;margin:14px auto 0}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow);margin-bottom:16px}
.lbl{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lbl .mini{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;color:var(--lav-ink);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.row{margin-bottom:22px}.row:last-child{margin-bottom:0}

.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:var(--pill);padding:4px;gap:3px}
.seg button{font-weight:600;font-size:14px;cursor:pointer;border:none;background:transparent;color:var(--ink2);padding:8px 16px;border-radius:var(--pill);transition:.15s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(45,42,62,.12)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.pfield{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px}
.pfield input{flex:1;min-width:0;background:transparent;border:none;color:var(--ink);font-family:var(--body);font-size:15px;font-weight:600;outline:none}
.pfield .x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.pfield .x:hover{color:var(--pink-ink)}
.addp{border:1px dashed var(--line2);background:transparent;border-radius:var(--r-md);padding:8px 10px;color:var(--ink2);font-weight:600;font-size:14px;cursor:pointer}
.addp:hover{border-color:var(--lav-ink);color:var(--lav-ink)}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-weight:600;font-size:14px;cursor:pointer;background:var(--card);color:var(--ink2);border:1px solid var(--line2);padding:7px 13px;border-radius:var(--pill);transition:.12s;user-select:none}
.chip:hover{border-color:var(--muted)}
.chip .n{font-size:11px;opacity:.6;margin-left:4px}
.chip.on{background:var(--lav);border-color:var(--lav-line);color:var(--lav-ink)}
.chip.time.on{background:var(--butter);border-color:var(--butter-line);color:var(--butter-ink)}
.selcount{font-size:13px;color:var(--ink2);margin-top:10px}

.btn{font-family:var(--display);font-weight:700;font-size:15px;cursor:pointer;border-radius:var(--pill);padding:14px 26px;transition:.15s;border:1px solid transparent;letter-spacing:-.01em}
.btn-main{background:var(--ink);color:#fff}
.btn-main:hover{background:#433f5a}
.btn-soft{background:var(--lav);color:var(--lav-ink);border-color:var(--lav-line)}
.btn-soft:hover{border-color:var(--lav-ink)}
.btn-block{display:block;width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn-row.c{justify-content:center}
.note{background:var(--butter);border:1px solid var(--butter-line);padding:12px 16px;border-radius:var(--r-md);font-size:14px;color:#5e4a00;margin-top:16px}
.note b{color:var(--butter-ink)}

/* role banner */
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--mint);border:1px solid var(--mint-line);border-radius:var(--r-md);padding:12px 16px;margin-bottom:16px}
.banner .now{font-family:var(--display);font-weight:800;font-size:16px;color:var(--mint-ink)}
.banner .sub{font-size:13px;color:var(--ink2)}
.banner .rnd{margin-left:auto;font-weight:700;font-size:12px;color:var(--mint-ink);letter-spacing:.04em;text-transform:uppercase;opacity:.8}

.intro{text-align:center;padding:24px 10px}
.intro .who{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,40px);letter-spacing:-.02em}
.intro .who .nm{color:var(--lav-ink)}
.intro .role{color:var(--ink2);font-size:15px;margin-top:8px}
.intro .others{margin-top:4px;color:var(--muted);font-size:14px}

/* timer */
.timer{margin-bottom:16px}
.track{height:12px;background:var(--soft);border-radius:var(--pill);overflow:hidden;border:1px solid var(--line)}
.bar{height:100%;width:100%;background:linear-gradient(90deg,var(--lav-line),var(--sky-line));border-radius:var(--pill);transition:width 1s linear}
.bar.low{background:linear-gradient(90deg,var(--pink-line),var(--peach-line))}
.clock{font-family:var(--display);font-weight:800;font-size:32px;text-align:center;margin-top:8px}
.clock.low{color:var(--pink-ink)}
.clock .pz{font-family:var(--body);font-size:13px;font-weight:700;color:var(--butter-ink);background:var(--butter);border:1px solid var(--butter-line);border-radius:var(--pill);padding:3px 10px;vertical-align:middle;margin-left:8px}

/* play card */
.play{border-radius:var(--r-lg);padding:38px 22px 26px;text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;border:1px solid var(--lav-line);background:var(--lav);transition:background .25s,border-color .25s}
.play .cat{font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-bottom:12px}
.play .word{font-family:var(--display);font-weight:800;font-size:clamp(32px,8vw,52px);line-height:1.1;letter-spacing:-.02em;color:var(--ink);word-break:break-word}
.ru{margin-top:16px;font-size:16px;font-weight:600;color:var(--ink2);background:rgba(255,255,255,.7);border-radius:var(--pill);padding:7px 16px;transition:opacity .2s}
.ru.off{opacity:0;pointer-events:none}
.left{display:block;margin-top:12px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.play.hidden .word,.play.hidden .ru{filter:blur(14px);user-select:none}
.play.hidden ~ .clues{filter:blur(10px);user-select:none}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.tbtn{font-weight:600;font-size:13px;color:var(--ink2);background:var(--card);border:1px solid var(--line2);border-radius:var(--pill);padding:7px 14px;cursor:pointer}
.tbtn:hover{border-color:var(--lav-ink);color:var(--lav-ink)}
.tbtn.life{background:var(--butter);border-color:var(--butter-line);color:var(--butter-ink);font-weight:700}
.tbtn.life:hover{border-color:var(--butter-ink)}

/* quick clues under the word */
.clues{margin-top:12px;background:var(--card);border:1px dashed var(--butter-line);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.clues[hidden]{display:none}
.clues .ch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.clues .ch b{font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--butter-ink)}
.cl{display:flex;align-items:center;gap:10px}
.cl .t{flex:1;min-width:0;font-size:17px;font-weight:600;line-height:1.35}
.cl .n{font-family:var(--display);font-weight:800;font-size:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--butter);color:var(--butter-ink);flex-shrink:0}
.spk{border:1px solid var(--line2);background:var(--soft);border-radius:var(--pill);width:32px;height:32px;display:grid;place-items:center;cursor:pointer;flex-shrink:0;font-size:14px}
.spk:hover{border-color:var(--lav-ink)}

.actions{display:flex;gap:12px;margin-top:16px}
.act{flex:1;font-family:var(--display);font-weight:700;font-size:18px;cursor:pointer;border-radius:var(--r-md);padding:18px;transition:.12s;border:1px solid}
.act:active{transform:scale(.98)}
.act-yes{background:var(--mint);color:var(--mint-ink);border-color:var(--mint-line)}
.act-yes:hover{border-color:var(--mint-ink)}
.act-skip{background:var(--peach);color:var(--peach-ink);border-color:var(--peach-line)}
.act-skip:hover{border-color:var(--peach-ink)}
.counters{display:flex;justify-content:center;gap:22px;margin-top:14px;font-weight:700;font-size:14px}
.counters .g{color:var(--mint-ink)}.counters .s{color:var(--peach-ink)}
.keys{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}

/* waiting */
.waiting{text-align:center;padding:40px 16px}
.waiting .eye{font-size:56px}
.waiting .wt{font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,30px);margin-top:8px}
.waiting .wt .nm{color:var(--lav-ink)}
.waiting .ws{color:var(--ink2);margin-top:6px}

/* results */
.big{font-family:var(--display);font-weight:800;font-size:64px;color:var(--lav-ink);line-height:1;text-align:center}
.bigsub{color:var(--ink2);text-align:center;margin:6px 0 10px}
.wl-h{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.wl{display:flex;gap:6px;flex-wrap:wrap}
.wl span,.wl button{font-family:inherit;font-size:14px;padding:5px 12px;border-radius:var(--pill);border:1px solid}
.wl.g span{background:var(--mint);border-color:var(--mint-line);color:var(--mint-ink)}
.wl.s button{background:var(--peach);border-color:var(--peach-line);color:var(--peach-ink);cursor:pointer}
.wl.s button:hover{border-color:var(--peach-ink)}
.wl span small,.wl button small{opacity:.7;margin-left:5px;font-size:12px}
.wl-tip{font-size:12px;color:var(--muted);margin-top:6px}
.winner{font-family:var(--display);font-weight:800;font-size:24px;text-align:center;color:var(--lav-ink)}
.stand{display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px;margin-top:8px}
.stand .m{font-size:22px}.stand .sn{font-weight:700;font-size:16px;flex:1}.stand .ss{font-family:var(--display);font-weight:800;font-size:20px;color:var(--lav-ink)}

.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink2);user-select:none}
.toggle .sw{width:42px;height:24px;border-radius:var(--pill);background:var(--line2);position:relative;transition:.15s;flex-shrink:0}
.toggle .sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:.15s}
.toggle.on .sw{background:var(--mint-ink)}
.toggle.on .sw::after{left:21px}
.tglist{display:flex;flex-direction:column;gap:12px}
/* online rooms */
.join-card{border:1.5px solid var(--lav-line)}
.joinrow{display:flex;gap:8px;flex-wrap:wrap}
.joinrow input{font-family:var(--body);font-size:17px;font-weight:600;padding:12px 14px;border-radius:var(--r-md);border:1.5px solid var(--line2);background:var(--soft);color:var(--ink);outline:none;min-width:0}
.joinrow input:focus{border-color:var(--lav-ink);background:var(--card)}
.joinrow .jcode{width:7.5em;flex:0 0 auto;font-family:var(--display);font-weight:800;letter-spacing:.18em;text-transform:uppercase;text-align:center}
.joinrow #jName{flex:1 1 160px}
.joinrow .btn{flex:0 0 auto}
.jerr{color:var(--pink-ink);font-weight:600;font-size:14px;margin-top:8px;min-height:1px}
.mini-link{background:none;border:none;color:var(--lav-ink);font-weight:600;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-top:10px;font-family:inherit}
.teacher>summary{list-style:none;cursor:pointer;font-family:var(--display);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.teacher>summary::-webkit-details-marker{display:none}
.teacher>summary::after{content:"+";font-size:20px;color:var(--muted)}
.teacher[open]>summary::after{content:"–"}
.teacher[open]>summary{margin-bottom:18px}
.hostname{font-family:var(--body);font-size:16px;font-weight:600;padding:10px 14px;border-radius:var(--r-md);border:1px solid var(--line2);background:var(--soft);color:var(--ink);width:100%;max-width:320px;outline:none}
.lobby-code{text-align:center;margin-bottom:22px}
.bigcode{font-family:var(--display);font-weight:800;font-size:clamp(52px,14vw,84px);letter-spacing:.12em;color:var(--lav-ink);line-height:1.05}
.sharelink{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--ink2);word-break:break-all}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.plist .pfield b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:700;color:var(--lav-ink);background:var(--lav);border-radius:var(--pill);padding:1px 8px}

#app>.card:first-child{margin-top:20px}
footer{text-align:center;margin-top:40px;color:var(--muted);font-size:13px}
@media(max-width:520px){.card{padding:18px}.play{padding:30px 16px 22px}.act{font-size:16px;padding:16px}.hero{padding:28px 0 18px}}

/* ===== LIFELINE ===== */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;font-family:var(--display);font-weight:700;font-size:15px;background:var(--butter);color:var(--butter-ink);border:1px solid var(--butter-line);border-radius:var(--pill);padding:13px 20px;cursor:pointer;box-shadow:0 8px 24px rgba(138,106,0,.18)}
.fab:hover{border-color:var(--butter-ink)}
.scrim{position:fixed;inset:0;background:rgba(45,42,62,.28);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:80;background:var(--bg);border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(45,42,62,.12);transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.dhead{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);background:var(--card)}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dtitle{font-family:var(--display);font-weight:800;font-size:17px}
.dtitle span{color:var(--butter-ink)}
.dclose{border:1px solid var(--line2);background:var(--soft);border-radius:var(--pill);padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink2)}
.dform{display:flex;gap:8px}
.dform[hidden]{display:none}
.dform input{flex:1;min-width:0;font-family:var(--body);font-size:17px;padding:11px 14px;border-radius:var(--r-md);border:1.5px solid var(--line2);background:var(--soft);color:var(--ink);outline:none}
.dform input:focus{border-color:var(--lav-ink);background:var(--card)}
.dform button{font-family:var(--display);font-weight:700;font-size:14px;border:none;background:var(--ink);color:#fff;border-radius:var(--r-md);padding:0 16px;cursor:pointer;white-space:nowrap}
.dform button:disabled{opacity:.5;cursor:default}
.dbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.dhint{font-size:13px;color:var(--ink2)}

.lc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:16px}
.lc-word{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em;word-break:break-word}
.lc-pos{color:var(--muted);font-size:13px;font-weight:600}
.lc-pron{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:4px}
.lc-say{font-weight:700;font-size:17px}
.lc-ipa{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--ink2)}
.lc-ru{font-size:18px;font-weight:700}
.lc-mean{color:var(--ink2);font-size:15px}
.lc-lbl{font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.al{list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:a}
.al li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:11px 12px;border-radius:var(--r-md);background:var(--soft);border:1px solid var(--line)}
.al li::before{counter-increment:a;content:counter(a);font-family:var(--display);font-weight:800;font-size:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--butter);color:var(--butter-ink);grid-row:span 2}
.al .en{font-size:17px;font-weight:600;line-height:1.3;min-width:0}
.al .ruu{font-size:13px;color:var(--ink2);grid-column:2;min-width:0}
.al .spk{grid-row:span 2}
.al li.quick{background:var(--butter);border-color:var(--butter-line)}
.al li.quick::before{background:var(--card)}
.taboo{display:flex;flex-wrap:wrap;gap:6px}
.taboo span{font-size:13px;font-weight:600;padding:4px 10px;border-radius:var(--pill);border:1px dashed var(--pink-line);color:var(--pink-ink);background:var(--pink);text-decoration:line-through}
.lc details{border-top:1px solid var(--line);padding-top:12px}
.lc summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
.lc summary::-webkit-details-marker{display:none}
.lc summary::after{content:"+";font-family:var(--display);font-size:18px;color:var(--muted)}
.lc details[open] summary::after{content:"–"}
.lc .dd{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.pr{display:flex;align-items:center;gap:10px;justify-content:space-between}
.pr>div{min-width:0}
.pr .en{font-weight:600}
.pr .ruu{font-size:13px;color:var(--ink2)}
.trap{border-left:3px solid var(--peach-line);padding-left:12px}
.lc-acts{display:flex;gap:8px;flex-wrap:wrap}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:14px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--lav-ink);animation:sp .8s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.err{color:var(--pink-ink);font-weight:600;font-size:14px}
.codebox{display:flex;gap:8px;margin-top:8px}
.codebox input{flex:1;min-width:0;font-family:var(--body);font-size:15px;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--line2)}
.codebox button{border:none;background:var(--ink);color:#fff;border-radius:var(--r-sm);padding:0 14px;font-weight:700;cursor:pointer}

.msgs{display:flex;flex-direction:column;gap:10px}
.msg{padding:11px 14px;border-radius:var(--r-md);white-space:pre-wrap;word-break:break-word;max-width:92%;font-size:15px}
.msg.me{align-self:flex-end;background:var(--lav);color:var(--lav-ink);font-weight:600}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.kit h4{font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 8px}
.kit .k{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 12px;margin-bottom:6px}
.kit .k>div{min-width:0}
.kit .en{font-weight:600}
.kit .ruu{font-size:13px;color:var(--ink2)}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist button{font-family:inherit;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line2);border-radius:var(--pill);padding:5px 11px;cursor:pointer;color:var(--ink)}
.hist button small{color:var(--muted);font-weight:500;margin-left:4px}
</style>
</head>
<body>
<div class="topbar"><div class="in"><div class="brand" onclick="toSetup()">NEURO<span>·</span>FLUENT</div><div class="toptag" id="modeTag">🗣️ Alias</div></div></div>
<div class="scorebar" id="scorebar"><div class="in" id="scoreIn"></div></div>
<div class="wrap" id="app"></div>

<button class="fab" id="fab" type="button" aria-haspopup="dialog">🛟 Lifeline</button>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true">
  <div class="dhead">
    <div class="dtop"><div class="dtitle" id="dTitle">🛟 <span>Lifeline</span></div><button class="dclose" id="dClose" type="button">Закрыть ✕</button></div>
    <div class="seg" id="dTabs"><button data-t="word" class="on" type="button">Слово</button><button data-t="ask" type="button">Вопрос</button><button data-t="kit" type="button">Фразы</button></div>
    <form class="dform" id="dForm" autocomplete="off"><input id="dQ" type="text" placeholder="umbrella / зонт" aria-label="Слово или вопрос"><button id="dGo" type="submit">Помоги</button></form>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>

<script src="deck1.js"></script>
<script src="deck2.js"></script>
<script src="deck3.js"></script>
<script src="online.js"></script>
<script>
/* ===== DECK (from deck*.js: english=russian=clue|clue) ===== */
const ORDER=["tech","kitchen","bathroom","cleaning","office","tools","packaging","home","bedroom","food","drinks","clothes","beauty","health","city","transport","shopping","leisure","kids","garden","travel","people","actions"].filter(k=>window.RAW&&RAW[k]);
const CATS={};ORDER.forEach(k=>{CATS[k]={label:RAW[k][0],w:RAW[k][1].trim().split('\n').map(l=>{const p=l.split('=');return[p[0],p[1],(p[2]||'').split('|').filter(Boolean)];})};});
const ALL=[];ORDER.forEach(k=>CATS[k].w.forEach(([en,ru,c])=>ALL.push({en,ru,c,cat:k})));
const BYWORD={};ALL.forEach(w=>{BYWORD[w.en.toLowerCase()]=w;BYWORD[w.ru.toLowerCase()]=BYWORD[w.ru.toLowerCase()]||w;});
const PAL=['lav','mint','peach','sky','pink','butter'];
const catColor=k=>PAL[ORDER.indexOf(k)%PAL.length];

/* ===== STATE ===== */
const LS='nf_alias_v2';
let S={mode:'online',hostName:'',players:['Player 1','Player 2','Player 3'],me:0,scores:[0,0,0],secs:60,cats:ORDER.slice(),hint:true,clues:true,pauseHelp:true};
try{const j=JSON.parse(localStorage.getItem(LS));if(j)S=Object.assign(S,j);}catch(e){}
if(!Array.isArray(S.players)||S.players.length<2)S.players=['Player 1','Player 2','Player 3'];
if(!Array.isArray(S.scores)||S.scores.length!==S.players.length)S.scores=S.players.map(()=>0);
S.cats=(S.cats||[]).filter(k=>ORDER.includes(k));if(!S.cats.length)S.cats=ORDER.slice();
if(S.me>=S.players.length)S.me=0;
if(S.mode==='own')S.mode='online';if(typeof S.clues!=='boolean')S.clues=true;if(typeof S.pauseHelp!=='boolean')S.pauseHelp=true;
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
const PCOL=['#cbbfff','#a8e0c9','#ffc4a8','#b3d4f7','#ffbcd4','#f5dd85'];
const N=()=>S.players.length;
const nm=i=>S.players[((i%N())+N())%N()]||('Player '+(i+1));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ===== GAME STATE ===== */
let phase='setup',dIdx=0,pass=1,turn=0,got=[],skipped=[],queue=[],current=null,hidden=false,timer=null,left=0,paused=false;
const app=document.getElementById('app');
function pool(){return ALL.filter(w=>S.cats.includes(w.cat));}
function refill(){queue=shuffle(pool());}
function amDescriber(){return S.mode!=='own'||S.me===dIdx;}

/* ===== SCOREBOARD ===== */
function renderScores(){
  const bar=document.getElementById('scorebar'),inn=document.getElementById('scoreIn');
  if(phase==='setup'){bar.classList.remove('show');return;}
  const act=['intro','play','wait','end'].includes(phase)?dIdx:-1;
  inn.innerHTML=S.players.map((p,i)=>`<div class="sc${i===act?' active':''}"><span class="nm"><span class="dot" style="background:${PCOL[i%PCOL.length]}"></span>${esc(nm(i))}</span><span class="val">${S.scores[i]}</span><span class="pm"><button data-i="${i}" data-d="-1" aria-label="minus">−</button><button data-i="${i}" data-d="1" aria-label="plus">+</button></span></div>`).join('')+`<button class="rst" id="rst">↺ reset</button>`;
  inn.querySelectorAll('.pm button').forEach(b=>b.onclick=()=>addScore(+b.dataset.i,+b.dataset.d));
  document.getElementById('rst').onclick=()=>{S.scores=S.players.map(()=>0);save();renderScores();};
  bar.classList.add('show');
}
function addScore(i,n){S.scores[i]=Math.max(0,(S.scores[i]||0)+n);save();renderScores();}

/* ===== RENDER ===== */
function setPhase(p){phase=p;render();}
function render(){
  stopTimer();
  app.innerHTML={setup:setupHTML,intro:introHTML,play:playHTML,wait:waitHTML,end:endHTML,stand:standHTML}[phase]();
  wire[phase]&&wire[phase]();
  renderScores();
  document.getElementById('modeTag').textContent=phase==='setup'?'🗣️ Alias':'🗣️ Alias · one screen';
  window.scrollTo(0,0);
}
const tog=(id,on,label)=>`<div class="toggle${on?' on':''}" id="${id}" role="switch" aria-checked="${on}" tabindex="0"><span class="sw"></span>${label}</div>`;

function setupHTML(){
  const total=pool().length;
  return `<div class="hero"><div class="kicker">🇷🇺 Russian hints · ${ALL.length} words · 🛟 Lifeline</div>
    <h1><span class="a">A</span><span class="b">l</span><span class="c">i</span><span class="d">a</span><span class="e">s</span></h1>
    <p>Describe the word in English — never say it. Stuck? Tap <b>🛟 Lifeline</b> for ready-made clues with Russian translations.</p></div>
  ${window.ONLINE?ONLINE.joinCardHTML():''}
  <details class="card teacher" id="teacherBox"${new URLSearchParams(location.search).get('code')?'':' open'}><summary>🎓 Teacher · set up a game</summary>
    <div class="row"><div class="lbl">1 · How are you playing?</div>
      <div class="seg" id="modeSeg"><button data-m="online" class="${S.mode==='online'?'on':''}">🌐 Online — players join with a code</button><button data-m="screen" class="${S.mode==='screen'?'on':''}">📺 One screen</button></div></div>
    ${S.mode==='online'?`<div class="row"><div class="lbl">2 · Your name</div><input class="hostname" id="hostName" maxlength="16" placeholder="Artyom" value="${esc(S.hostName||'')}"></div>`:`<div class="row"><div class="lbl">2 · Players</div>
      <div class="pgrid" id="pgrid">${S.players.map((p,i)=>`<div class="pfield"><span class="dot" style="background:${PCOL[i%PCOL.length]}"></span><input value="${esc(p)}" data-i="${i}" maxlength="14">${N()>2?`<button class="x" data-x="${i}" aria-label="remove">✕</button>`:''}</div>`).join('')}${N()<6?'<button class="addp" id="addp">+ Add player</button>':''}</div></div>`}
    <div class="row"><div class="lbl">3 · Round length</div><div class="chips" id="timeChips">${[30,60,90,120].map(s=>`<div class="chip time${s===S.secs?' on':''}" data-s="${s}">${s}s</div>`).join('')}</div></div>
    <div class="row"><div class="lbl">4 · Categories <button class="mini" id="catAll">all</button><button class="mini" id="catNone">none</button></div>
      <div class="chips" id="catChips">${ORDER.map(k=>`<div class="chip${S.cats.includes(k)?' on':''}" data-c="${k}">${CATS[k].label}<span class="n">${CATS[k].w.length}</span></div>`).join('')}</div>
      <div class="selcount" id="selCount">${total} words selected</div></div>
    <div class="row"><div class="lbl">5 · Help</div><div class="tglist">
      ${tog('hintTog',S.hint,'Show Russian hint under the word')}
      ${tog('cluesTog',S.clues,'Show 2 easy clues under the word')}
      ${tog('pauseTog',S.pauseHelp,'🛟 Lifeline pauses the timer')}</div></div>
    <button class="btn btn-main btn-block" id="go">${S.mode==='online'?'Create game — get a code ▶':`Start — ${esc(nm(0))} describes first ▶`}</button>
    <div class="jerr" id="goErr"></div>
    <div class="note"><b>How it works:</b> one player describes, everyone else guesses. ✓ = guessed, ⏭ = skip. Points go to the describer. Describer rotates every turn.${S.mode==='online'?' <b>Online:</b> you get a 4-letter code; players open this site on their own phone or laptop, type the code and their name. Only the describer sees the word.':''} <b>🛟 Lifeline</b> is always in the corner: clues, Russian explanations, pronunciation and a helper chat.</div>
  </details><footer>Neuro-Fluent · Alias · ${ALL.length} everyday words</footer>`;
}
function guessers(){return S.players.map((_,i)=>i).filter(i=>i!==dIdx).map(nm).join(' & ');}
function introHTML(){
  const can=amDescriber();
  return `<div class="card"><div class="banner"><span class="now">🎙 ${esc(nm(dIdx))} describes</span><span class="sub">${esc(guessers())} guess</span><span class="rnd">round ${pass} · turn ${turn+1}</span></div>
    <div class="intro"><div class="who"><span class="nm">${esc(nm(dIdx))}</span>, you're up!</div>
    <div class="role">${can?'Describe each word in English — never say the word itself.':'Listen and shout your guesses. No peeking 🙈'}</div>
    <div class="others">Guessing: ${esc(guessers())}</div></div>
    <div class="btn-row c">${can?`<button class="btn btn-main" id="startTurn">Start ${S.secs}s ▶</button>`:`<button class="btn btn-soft" id="guess">I'm guessing 🙈 ▶</button>`}<button class="btn btn-soft" id="back">⚙ Settings</button></div></div>`;
}
function playHTML(){
  const peek=S.mode!=='own'?`<button class="tbtn" id="peek">${hidden?'👁 Show word':'🙈 Hide word'}</button>`:'';
  return `<div class="card"><div class="banner"><span class="now">🎙 ${esc(nm(dIdx))}</span><span class="sub">describing</span><span class="rnd">round ${pass}</span></div>
    <div class="timer"><div class="track"><div class="bar" id="bar"></div></div><div class="clock" id="clock">${fmt(S.secs)}</div></div>
    <div class="play${hidden?' hidden':''}" id="playCard"><div class="cat" id="cat"></div><div class="word" id="word">—</div><div class="ru${S.hint?'':' off'}" id="ru"></div><span class="left" id="left"></span></div>
    <div class="clues" id="clues"${S.clues?'':' hidden'}></div>
    <div class="tools"><button class="tbtn life" id="lifeBtn">🛟 Help with this word</button>${peek}<button class="tbtn" id="hintBtn">${S.hint?'🙈 Hide Russian':'🇷🇺 Show Russian'}</button><button class="tbtn" id="cluesBtn">${S.clues?'🙈 Hide clues':'💡 Show clues'}</button><button class="tbtn" id="endEarly">⏹ End turn</button></div>
    <div class="actions"><button class="act act-skip" id="skip">⏭ Skip</button><button class="act act-yes" id="yes">✓ Got it</button></div>
    <div class="counters"><span class="g">✓ <b id="gc">0</b></span><span class="s">⏭ <b id="scnt">0</b></span></div>
    <div class="keys">Keyboard: → or Enter = got it · ← = skip · H = help</div></div>`;
}
function waitHTML(){
  return `<div class="card"><div class="banner"><span class="now">🙈 ${esc(nm(dIdx))} is describing</span><span class="sub">you guess out loud</span><span class="rnd">round ${pass}</span></div>
    <div class="waiting"><div class="eye">🙈</div><div class="wt"><span class="nm">${esc(nm(dIdx))}</span> is describing…</div><div class="ws">Shout your guesses!</div></div>
    <div class="btn-row c"><button class="btn btn-main" id="waitNext">${esc(nm(dIdx))}'s turn ended ▶</button></div></div>`;
}
function endHTML(){
  const next=(dIdx+1)%N();
  const mine=amDescriber();
  const empty='<span style="border:none;background:none;color:var(--muted)">—</span>';
  const head=mine?`<div class="big">${got.length}</div><div class="bigsub">words guessed for ${esc(nm(dIdx))} — added to the score ✓</div>`
    :`<div class="intro"><div class="who"><span class="nm">${esc(nm(dIdx))}</span>'s turn is done</div><div class="role">Their device adds the points. Fix with +/− if needed.</div></div>`;
  const gl=got.length?got.map(w=>`<span>${esc(w.en)}<small>${esc(w.ru)}</small></span>`).join(''):empty;
  const sl=skipped.length?skipped.map((w,i)=>`<button type="button" data-sk="${i}">${esc(w.en)}<small>${esc(w.ru)}</small></button>`).join(''):empty;
  const lists=mine?`<div class="wl-h">✓ Got it</div><div class="wl g">${gl}</div><div class="wl-h">⏭ Skipped</div><div class="wl s" id="skList">${sl}</div>${skipped.length?'<div class="wl-tip">Tap a skipped word to see how you could explain it 🛟</div>':''}`:'';
  return `<div class="card">${head}${lists}
    <div class="btn-row"><button class="btn btn-main" id="next">${next===0?'Next round':'Next'}: ${esc(nm(next))} ▶</button><button class="btn btn-soft" id="stand">🏁 Standings</button></div></div>`;
}
function standHTML(){
  const o=S.players.map((p,i)=>({p:nm(i),s:S.scores[i]})).sort((a,b)=>b.s-a.s);
  const med=['🥇','🥈','🥉','🎈','🎈','🎈'];
  return `<div class="card"><div class="winner">🏆 ${esc(o[0].p)} leads!</div>
    ${o.map((x,r)=>`<div class="stand"><span class="m">${med[r]}</span><span class="sn">${esc(x.p)}</span><span class="ss">${x.s}</span></div>`).join('')}
    <div class="btn-row"><button class="btn btn-main" id="keep">Keep playing ▶</button><button class="btn btn-soft" id="again">New game (reset scores)</button><button class="btn btn-soft" id="back">⚙ Settings</button></div></div>`;
}

/* ===== TIMER ===== */
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}paused=false;}
function tick(){
  const b=document.getElementById('bar'),c=document.getElementById('clock');if(!b)return;
  b.style.width=(left/S.secs*100)+'%';c.innerHTML=fmt(left)+(paused?'<span class="pz">⏸ Lifeline</span>':'');
  const low=left<=10;b.classList.toggle('low',low);c.classList.toggle('low',low);
}
function startTimer(){left=S.secs;paused=false;tick();timer=setInterval(()=>{if(paused)return;left--;if(left<0)left=0;tick();if(left<=0)finishTurn();},1000);}
function setPaused(p){if(!timer)return;paused=p;tick();}
function finishTurn(){stopTimer();closeLife();addScore(dIdx,got.length);setPhase('end');}

/* ===== WORDS ===== */
function cluesHTML(w){
  if(!w||!w.c||!w.c.length)return'';
  return `<div class="ch"><b>💡 Easy clues — read them out</b></div>`+w.c.map((t,i)=>`<div class="cl"><span class="n">${i+1}</span><span class="t">${esc(t)}</span><button class="spk" type="button" data-say="${esc(t)}" aria-label="Listen">🔊</button></div>`).join('');
}
function nextWord(){
  if(!queue.length)refill();
  current=queue.shift();
  const pc=document.getElementById('playCard');
  const col=catColor(current.cat);
  pc.style.background=`var(--${col})`;pc.style.borderColor=`var(--${col}-line)`;
  document.getElementById('cat').textContent=CATS[current.cat].label;
  document.getElementById('cat').style.color=`var(--${col}-ink)`;
  document.getElementById('word').textContent=current.en;
  document.getElementById('ru').textContent='🇷🇺 '+current.ru;
  document.getElementById('left').textContent=queue.length+' left in deck';
  document.getElementById('clues').innerHTML=cluesHTML(current);
}
function mark(ok){if(!timer)return;(ok?got:skipped).push(current);document.getElementById(ok?'gc':'scnt').textContent=(ok?got:skipped).length;nextWord();}

/* ===== WIRING ===== */
const $=id=>document.getElementById(id);
function wireTog(id,key,after){const el=$(id);const f=()=>{S[key]=!S[key];save();el.classList.toggle('on',S[key]);el.setAttribute('aria-checked',S[key]);after&&after();};el.onclick=f;el.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();f();}};}
const wire={
  setup(){
    $('modeSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;save();render();});
    if(window.ONLINE)ONLINE.wireJoin();
    const hn=$('hostName');if(hn)hn.oninput=()=>{S.hostName=hn.value;save();};
    if($('pgrid')){$('pgrid').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{const i=+inp.dataset.i;S.players[i]=inp.value;save();if(S.mode!=='online')$('go').textContent=`Start — ${nm(0)} describes first ▶`;const mc=$('meChips');if(mc)mc.children[i].textContent=nm(i);});
    $('pgrid').querySelectorAll('.x').forEach(x=>x.onclick=()=>{const i=+x.dataset.x;S.players.splice(i,1);S.scores.splice(i,1);if(S.me>=N())S.me=0;save();render();});}
    const ap=$('addp');if(ap)ap.onclick=()=>{S.players.push('Player '+(N()+1));S.scores.push(0);save();render();};
    const mc=$('meChips');if(mc)mc.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.me=+c.dataset.me;save();render();});
    $('timeChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.secs=+c.dataset.s;save();$('timeChips').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));});
    const upd=()=>{$('catChips').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',S.cats.includes(c.dataset.c)));const n=pool().length;$('selCount').textContent=n?n+' words selected':'Pick at least one category';$('go').disabled=!n;$('go').style.opacity=n?1:.4;save();};
    $('catChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const k=c.dataset.c;S.cats=S.cats.includes(k)?S.cats.filter(x=>x!==k):S.cats.concat(k);upd();});
    $('catAll').onclick=()=>{S.cats=ORDER.slice();upd();};
    $('catNone').onclick=()=>{S.cats=[];upd();};
    wireTog('hintTog','hint');wireTog('cluesTog','clues');wireTog('pauseTog','pauseHelp');
    $('go').onclick=()=>{if(!pool().length)return;
      if(S.mode==='online'){const n=(S.hostName||'').trim()||'Teacher';ONLINE.create(n,$('go'),$('goErr'));return;}S.players=S.players.map((p,i)=>p.trim()||('Player '+(i+1)));save();dIdx=0;pass=1;turn=0;refill();setPhase('intro');};
  },
  intro(){
    const st=$('startTurn');if(st)st.onclick=()=>{got=[];skipped=[];hidden=false;setPhase('play');};
    const g=$('guess');if(g)g.onclick=()=>setPhase('wait');
    $('back').onclick=toSetup;
  },
  play(){
    nextWord();startTimer();
    $('yes').onclick=()=>mark(true);$('skip').onclick=()=>mark(false);
    $('endEarly').onclick=()=>finishTurn();
    $('lifeBtn').onclick=()=>openLife(current);
    const pk=$('peek');if(pk)pk.onclick=()=>{hidden=!hidden;$('playCard').classList.toggle('hidden',hidden);pk.textContent=hidden?'👁 Show word':'🙈 Hide word';};
    $('hintBtn').onclick=()=>{S.hint=!S.hint;save();$('ru').classList.toggle('off',!S.hint);$('hintBtn').textContent=S.hint?'🙈 Hide Russian':'🇷🇺 Show Russian';};
    $('cluesBtn').onclick=()=>{S.clues=!S.clues;save();$('clues').hidden=!S.clues;$('cluesBtn').textContent=S.clues?'🙈 Hide clues':'💡 Show clues';};
  },
  wait(){$('waitNext').onclick=()=>setPhase('end');},
  end(){
    $('next').onclick=()=>{dIdx=(dIdx+1)%N();if(dIdx===0)pass++;turn++;got=[];skipped=[];setPhase('intro');};
    $('stand').onclick=()=>setPhase('stand');
    const sk=$('skList');if(sk)sk.querySelectorAll('button[data-sk]').forEach(b=>b.onclick=()=>openLife(skipped[+b.dataset.sk]));
  },
  stand(){
    $('keep').onclick=()=>{dIdx=(dIdx+1)%N();if(dIdx===0)pass++;turn++;got=[];skipped=[];setPhase('intro');};
    $('again').onclick=()=>{S.scores=S.players.map(()=>0);save();dIdx=0;pass=1;turn=0;got=[];skipped=[];refill();setPhase('intro');};
    $('back').onclick=toSetup;
  }
};
function toSetup(){if(window.ONLINE&&ONLINE.active)return;stopTimer();closeLife();setPhase('setup');}
document.addEventListener('keydown',e=>{
  if(lifeOpen){if(e.key==='Escape')closeLife();return;}
  if(phase!=='play'||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();mark(true);}
  else if(e.key==='ArrowLeft'){e.preventDefault();mark(false);}
  else if(e.key==='h'||e.key==='H'){e.preventDefault();openLife(current);}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)speak(b.dataset.say);});

/* ===================== LIFELINE ===================== */
const drawer=$('drawer'),scrim=$('scrim'),dBody=$('dBody'),dQ=$('dQ'),dGo=$('dGo');
let lifeOpen=false,lifeTab='word',lifeCard=null,lifeBusy=false,chatTurns=[];
const CARDS_LS='nf_lifeline_cards_v1',CODE_LS='nf_lifeline_code';
let cards={};try{cards=JSON.parse(localStorage.getItem(CARDS_LS)||'{}')||{};}catch(e){cards={};}
const saveCards=()=>{try{const ks=Object.keys(cards);if(ks.length>150)ks.sort((a,b)=>(cards[a]._t||0)-(cards[b]._t||0)).slice(0,ks.length-150).forEach(k=>delete cards[k]);localStorage.setItem(CARDS_LS,JSON.stringify(cards));}catch(e){}};
const getCode=()=>{try{return localStorage.getItem(CODE_LS)||'';}catch(e){return'';}};
const setCode=v=>{try{localStorage.setItem(CODE_LS,v);}catch(e){}};

function speak(text){
  try{const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;
    const vs=speechSynthesis.getVoices();const v=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
try{speechSynthesis.getVoices();}catch(e){}
const spk=t=>`<button class="spk" type="button" data-say="${esc(t)}" aria-label="Listen">🔊</button>`;

function openLife(word){
  // in own-device mode, a guesser must never get the current word pre-filled
  const allowWord=word&&(phase!=='play'||amDescriber());
  lifeOpen=true;drawer.classList.add('open');scrim.classList.add('open');drawer.setAttribute('aria-hidden','false');
  if(phase==='play'&&S.pauseHelp)setPaused(true);
  if(window.ONLINE&&ONLINE.active)ONLINE.onLife(true);
  setTab('word',true);
  if(allowWord){dQ.value=word.en;lookup(word.en,false,word);}
  else{renderWordHome();setTimeout(()=>dQ.focus(),250);}
}
function closeLife(){
  if(!lifeOpen)return;lifeOpen=false;drawer.classList.remove('open');scrim.classList.remove('open');drawer.setAttribute('aria-hidden','true');
  if(phase==='play')setPaused(false);
  if(window.ONLINE&&ONLINE.active)ONLINE.onLife(false);
  try{speechSynthesis.cancel();}catch(e){}
}
$('fab').onclick=()=>lifeOpen?closeLife():openLife(window.ONLINE&&ONLINE.active?ONLINE.myWord():(phase==='play'?current:null));
$('dClose').onclick=closeLife;scrim.onclick=closeLife;
$('dTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
function setTab(t,silent){
  lifeTab=t;$('dTabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('dForm').hidden=(t==='kit');
  dQ.placeholder=t==='word'?'umbrella / зонт':'Как сказать «моя очередь»?';
  dGo.textContent=t==='word'?'Помоги':'Спросить';
  if(silent)return;
  if(t==='word'){lifeCard?renderLifeCard(lifeCard):renderWordHome();}
  else if(t==='ask')renderChat();else renderKit();
}
$('dForm').addEventListener('submit',e=>{e.preventDefault();if(lifeBusy)return;const v=dQ.value.trim();if(!v)return;
  if(lifeTab==='word')lookup(v,false);else sendChat(v);});

async function api(payload){
  const r=await fetch('/api/help',{method:'POST',headers:Object.assign({'content-type':'application/json','x-lifeline-code':getCode()},window.ONLINE?ONLINE.headers():{}),body:JSON.stringify(payload)});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){const err=new Error(j.message||j.error||('HTTP '+r.status));err.code=j.error||('http_'+r.status);err.status=r.status;throw err;}
  return j;
}
function errMsg(e){
  if(e.code==='bad_code')return null;
  if(e.code==='no_key')return'Помощник ещё не настроен: учителю нужно добавить ANTHROPIC_API_KEY в Vercel.';
  if(e.status===429)return'Слишком много запросов. Подожди минутку.';
  if(e.status===404||e.code==='http_404')return'Помощник работает только на сайте (Vercel). Готовые подсказки и фразы работают и так.';
  return'Не получилось связаться с помощником. Попробуй ещё раз.';
}
function codePrompt(retry){
  const box=document.createElement('div');box.className='lc';
  box.innerHTML='<div class="err">Нужен код доступа от учителя.</div><form class="codebox"><input type="text" placeholder="Код" aria-label="Код доступа"><button type="submit">OK</button></form>';
  box.querySelector('form').onsubmit=e=>{e.preventDefault();setCode(box.querySelector('input').value.trim());retry();};
  return box;
}

/* --- word tab --- */
function quickBlock(w){
  if(!w||!w.c||!w.c.length)return'';
  return `<div><div class="lc-lbl">💡 Easy clues (ready now)</div><ol class="al">${w.c.map(t=>`<li class="quick"><span class="en">${esc(t)}</span>${spk(t)}</li>`).join('')}</ol></div>`;
}
function renderWordHome(){
  lifeCard=null;
  const hist=Object.keys(cards).sort((a,b)=>(cards[b]._t||0)-(cards[a]._t||0)).slice(0,30);
  dBody.innerHTML=`<div class="dhint">Напиши любое слово по-английски или по-русски — получишь, как его объяснить простыми фразами, с переводом и произношением.</div>
    ${hist.length?`<div><div class="lc-lbl">Мой словарик</div><div class="hist">${hist.map(k=>`<button type="button" data-h="${esc(k)}">${esc(cards[k].word)}<small>${esc(cards[k].ru||'')}</small></button>`).join('')}</div></div>`:''}
    <div class="lc"><div class="lc-lbl">Фразы-спасатели</div>${kitHTML(1)}<button class="tbtn" type="button" id="moreKit">Все фразы →</button></div>`;
  dBody.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{lifeCard=cards[b.dataset.h];dQ.value=lifeCard.word;renderLifeCard(lifeCard);});
  const mk=$('moreKit');if(mk)mk.onclick=()=>setTab('kit');
}
async function lookup(input,variant,deckWord){
  const key=input.toLowerCase();
  const dw=deckWord||BYWORD[key];
  if(!variant&&cards[key]){lifeCard=cards[key];renderLifeCard(lifeCard,dw);return;}
  lifeBusy=true;dGo.disabled=true;
  dBody.innerHTML=(dw?`<div class="lc"><div><div class="lc-word">${esc(dw.en)}</div><div class="lc-ru" style="margin-top:6px">${esc(dw.ru)}</div></div>${quickBlock(dw)}</div>`:'')+
    `<div class="lc"><div class="thinking"><div class="spin"></div>Готовлю полную подсказку: фразы с переводом, произношение, нюансы…</div></div>`;
  try{
    const data=await api({mode:'word',input,variant:!!variant});
    data._t=Date.now();data._in=input;
    cards[key]=data;if(data.word)cards[data.word.toLowerCase()]=data;saveCards();
    if(lifeOpen&&lifeTab==='word'){lifeCard=data;renderLifeCard(data,dw);}
  }catch(e){
    if(!(lifeOpen&&lifeTab==='word'))return;
    const m=errMsg(e);
    const box=document.createElement('div');
    if(m===null){box.append(codePrompt(()=>lookup(input,variant,deckWord)));}
    else{box.className='lc';box.innerHTML=`<div class="err">${esc(m)}</div>`;}
    dBody.querySelectorAll('.lc').forEach((el,i,a)=>{if(i===a.length-1)el.remove();});
    dBody.append(box);
  }finally{lifeBusy=false;dGo.disabled=false;}
}
function pairs(list){return(list||[]).map(p=>`<div class="pr"><div><div class="en">${esc(p.en)}</div><div class="ruu">${esc(p.ru)}</div></div>${spk(p.en)}</div>`).join('');}
function renderLifeCard(c,dw){
  dw=dw||BYWORD[(c.word||'').toLowerCase()]||BYWORD[(c._in||'').toLowerCase()];
  dBody.innerHTML=`<div class="lc">
    <div><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><div class="lc-word">${esc(c.word)}</div><span class="lc-pos">${esc(c.pos||'')}</span></div>
      <div class="lc-pron"><span class="lc-say">${esc(c.say||'')}</span><span class="lc-ipa">${esc(c.ipa||'')}</span>${spk(c.word)}</div></div>
    <div><div class="lc-ru">${esc(c.ru||'')}</div><div class="lc-mean">${esc(c.meaning_ru||'')}</div></div>
    ${quickBlock(dw)}
    <div><div class="lc-lbl">Скажи команде (по порядку)</div><ol class="al">${(c.alias||[]).map(x=>`<li><span class="en">${esc(x.en)}</span>${spk(x.en)}<span class="ruu">${esc(x.ru)}</span></li>`).join('')}</ol></div>
    ${(c.taboo&&c.taboo.length)?`<div><div class="lc-lbl">Нельзя говорить</div><div class="taboo">${c.taboo.map(t=>`<span>${esc(t)}</span>`).join('')}</div></div>`:''}
    <details><summary>Примеры и сочетания</summary><div class="dd">${c.examples&&c.examples.length?'<div class="lc-lbl">Примеры</div>'+pairs(c.examples):''}${c.collocations&&c.collocations.length?'<div class="lc-lbl">Часто вместе</div>'+pairs(c.collocations):''}</div></details>
    <details><summary>Нюансы и ловушка</summary><div class="dd">${c.nuance_ru?`<div>${esc(c.nuance_ru)}</div>`:''}${c.trap_ru?`<div class="trap"><div class="lc-lbl">Частая ошибка</div><div>${esc(c.trap_ru)}</div></div>`:''}</div></details>
    <div class="lc-acts"><button class="tbtn" type="button" id="moreClues">🔄 Другие подсказки</button>${phase==='play'?'<button class="tbtn life" type="button" id="backPlay">▶ Вернуться к игре</button>':''}</div>
  </div>`;
  $('moreClues').onclick=()=>lookup(c._in||c.word,true,dw);
  const bp=$('backPlay');if(bp)bp.onclick=closeLife;
}

/* --- ask tab --- */
const STARTERS=['Как сказать «я не поняла, повтори»?','Что значит “It’s on the tip of my tongue”?','Как объяснить слово «счастье»?','Как сказать «моя очередь»?'];
function renderChat(){
  dBody.innerHTML=`<div class="msgs" id="msgs">${chatTurns.length?chatTurns.map(t=>`<div class="msg ${t.role==='user'?'me':'bot'}">${esc(t.content)}</div>`).join(''):
    `<div class="msg bot">Спроси что угодно по уроку — по-русски. Например:</div><div class="hist">${STARTERS.map(s=>`<button type="button" data-st="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}</div>
    ${chatTurns.length?'<button class="tbtn" type="button" id="clrChat" style="align-self:flex-start">Очистить чат</button>':''}`;
  dBody.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>sendChat(b.dataset.st));
  const cl=$('clrChat');if(cl)cl.onclick=()=>{chatTurns=[];renderChat();};
  dBody.scrollTop=dBody.scrollHeight;
}
async function sendChat(text){
  dQ.value='';chatTurns.push({role:'user',content:text});renderChat();
  const m=document.createElement('div');m.className='msg bot';m.innerHTML='<span class="thinking"><span class="spin"></span>Думаю…</span>';$('msgs').append(m);dBody.scrollTop=dBody.scrollHeight;
  lifeBusy=true;dGo.disabled=true;
  try{const j=await api({mode:'chat',turns:chatTurns});chatTurns.push({role:'assistant',content:j.text||'…'});if(lifeTab==='ask')renderChat();}
  catch(e){chatTurns.pop();const em=errMsg(e);if(em===null){m.replaceWith(codePrompt(()=>sendChat(text)));}else{m.textContent=em;}}
  finally{lifeBusy=false;dGo.disabled=false;}
}

/* --- phrase kit (works offline) --- */
const KIT=[
 ['Что это за слово',[["It's a thing.","Это вещь."],["It's a person.","Это человек."],["It's a place.","Это место."],["It's an animal.","Это животное."],["It's food.","Это еда."],["It's an action. You do it.","Это действие. Ты это делаешь."],["It's a feeling.","Это чувство."],["It's a word for…","Это слово для…"]]],
 ['Как описать',[["It's big / small.","Оно большое / маленькое."],["It's the opposite of…","Это противоположность…"],["It's like… but…","Это как… но…"],["You use it for…","Ты используешь это для…"],["You can find it in…","Это можно найти в…"],["A person who…","Человек, который…"],["You do it when…","Ты делаешь это, когда…"],["It sounds like…","Звучит похоже на…"],["The first letter is…","Первая буква…"],["Two words. First word…","Два слова. Первое слово…"]]],
 ['Реакции в игре',[["Yes! Exactly!","Да! Точно!"],["Almost!","Почти!"],["No, the opposite.","Нет, наоборот."],["Similar! Another word.","Похоже! Другое слово."],["Pass. / Next.","Пропускаю. / Дальше."],["Wait, one second…","Подожди секунду…"],["I don't know this word.","Я не знаю это слово."],["Can you say it again, please?","Повтори, пожалуйста."]]]
];
function kitHTML(groups){return'<div class="kit">'+KIT.slice(0,groups||KIT.length).map(([h,items])=>`<h4>${esc(h)}</h4>`+items.map(([en,ru])=>`<div class="k"><div><div class="en">${esc(en)}</div><div class="ruu">${esc(ru)}</div></div>${spk(en)}</div>`).join('')).join('')+'</div>';}
function renderKit(){dBody.innerHTML=`<div class="dhint">Эти фразы помогают объяснить любое слово. Нажми 🔊, чтобы услышать.</div>${kitHTML()}`;}

render();
</script>
</body>
